# Источники новостей. enabled: false — временно выключить, не удаляя.
# lang: en / zh / ru — влияет на подсказку модели при рерайте.
# china_native: true — источник сам по себе про Китай, отдельный фильтр «про Китай?» не нужен.
# weight — множитель к итоговому score (1.0 = обычный).

