# Публичные Telegram-каналы (читаются через веб-превью t.me/s/<username>, без API-аккаунта).
# Укажите username без @. Это для мониторинга повестки — тексты всё равно переписываются заново.
telegram:
  - id: tg_example
    name: Пример
    username: durov
    lang: en
    china_native: false
    weight: 0.7
    enabled: false

# Hacker News через Algolia API — ловит то, что обсуждают инженеры.
hackernews:
  enabled: true
  weight: 0.8
  min_points: 40
  queries:
    - China chip
    - China AI
    - Huawei
    - DeepSeek
    - Chinese semiconductor
