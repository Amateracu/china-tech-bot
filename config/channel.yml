# Голос канала. Это попадает в промпт — меняйте свободно, тут задаётся вся подача.
channel:
  name: ""            # название канала, можно оставить пустым
  topic: "технологии Китая: чипы, ИИ, электромобили, роботы, гаджеты"
  audience: "русскоязычные читатели, интересующиеся технологиями; не инженеры, но понимают базовые термины"
  voice: |
    Живо и с позицией, но без кликбейта. Пишет человек, который давно следит
    за китайской техникой: не просто пересказывает, а объясняет, почему это важно,
    сравнивает с тем, что читатель знает, замечает подвох, иногда позволяет себе
    иронию. Коротко и конкретно, без канцелярита и без восторженных воплей.
  length: "550-800 символов видимого текста (теги не считаются)"
  # Эмодзи — по правилам, а не россыпью: слишком много эмодзи выглядит как бот-спам.
  emoji: >-
    эмодзи рубрики в начале заголовка; в тексте ещё 1-2 смысловых маркера в начале
    строк (💰 цена, 📅 сроки, ⚡ зарядка/скорость, 🔋 батарея, 📦 продажи, 🏭 производство);
    💬 перед авторской репликой; всего не больше 5 эмодзи; не ставь эмодзи внутри
    предложения и цепочками; никаких 🔥🚀😱
  hashtags: 2         # сколько хэштегов в конце

  # Закрытый список рубрик: эмодзи + хэштег. Модель выбирает подходящую,
  # ничего своего не выдумывает — за счёт этого лента выглядит единообразно.
  rubrics:
    - "🔲 #чипы — полупроводники, литография, производство, экспортный контроль"
    - "🧠 #ИИ — модели, открытые веса, облака, ИИ-сервисы"
    - "🤖 #роботы — гуманоиды, промышленная робототехника, дроны"
    - "🔋 #электромобили — EV, батареи, автопилот, зарядки"
    - "📱 #гаджеты — смартфоны, ноутбуки, носимое, бытовая техника"
    - "🛰 #космос — спутники, запуски, связь"
    - "⚖️ #рынок — сделки, IPO, санкции, регулирование"
  cta: ""             # необязательная подпись в конце каждого поста

# Картинки к постам.
#   source_or_card — фото источника, если нет — своя карточка с заголовком (по умолчанию)
#   source_only    — только фото источника, иначе пост уходит текстом
#   card_only      — всегда своя карточка, чужие фото не трогаем
#   off            — без картинок
media:
  mode: source_or_card
  min_width: 400
  min_height: 220
  max_bytes: 9000000
  card_bg: [166, 26, 32]     # фон карточки, RGB
  card_fg: [245, 241, 233]   # текст карточки

pipeline:
  lookback_hours: 20        # насколько старые новости ещё рассматриваем
  max_candidates: 60        # сколько кандидатов после предфильтра уходит на дедуп
  max_per_run: 2            # сколько постов максимум уходит в модерацию за один запуск
  max_queue: 6              # не собирать новое, пока в очереди столько неразобранных
  min_llm_score: 7          # оценка модели 0-10, ниже — не предлагать
  dedupe_similarity: 0.55   # порог похожести заголовков (0-1), выше — считаем дублем
  seen_keep: 3000           # сколько последних новостей помним для дедупа по ссылкам
  event_dedupe: true        # дедуп по смыслу через DeepSeek: одно событие из разных изданий
  event_memory_days: 10     # сколько дней помним показанные события
  followups: true           # новые факты по старому событию — присылать с пометкой 🔁

publishing:
  timezone_offset: 3        # Минск, UTC+3
  window_start: 9           # публикуем не раньше
  window_end: 22            # и не позже
  min_gap_minutes: 30       # минимальный интервал между постами
  max_per_day: 12           # при интервале 30 мин и окне 9-22 влезает до 26
