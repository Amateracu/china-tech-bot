# Голос канала. Это попадает в промпт — меняйте свободно, тут задаётся вся подача.
channel:
  name: ""            # название канала, можно оставить пустым
  topic: "технологии Китая: чипы, ИИ, электромобили, роботы, гаджеты"
  audience: "русскоязычные читатели, интересующиеся технологиями; не инженеры, но понимают базовые термины"
  voice: |
    Сухо, по делу, без восторгов и канцелярита. Как будто пишет человек, который
    разбирается в теме и не пытается продать эмоцию. Никакого «прорыв», «революция»,
    «шок». Первая строка — суть новости, а не подводка.
  length: "500-800 символов"
  emoji: "максимум один эмодзи в начале первой строки, часто — вообще без эмодзи"
  hashtags: 2         # сколько хэштегов в конце
  cta: ""             # необязательная подпись в конце каждого поста

# Картинки к постам.
#   source_or_card — фото источника, если нет — своя карточка с заголовком (по умолчанию)
#   source_only    — только фото источника, иначе пост уходит текстом
#   card_only      — всегда своя карточка, чужие фото не трогаем
#   off            — без картинок
media:
  mode: source_or_card
  min_width: 400
  min_height: 220
  max_bytes: 9000000
  card_bg: [166, 26, 32]     # фон карточки, RGB
  card_fg: [245, 241, 233]   # текст карточки

pipeline:
  lookback_hours: 20        # насколько старые новости ещё рассматриваем
  max_candidates: 40        # сколько кандидатов после предфильтра уходит на дедуп
  max_per_run: 5            # сколько постов максимум уходит в модерацию за один запуск
  min_llm_score: 6          # оценка модели 0-10, ниже — не предлагать
  dedupe_similarity: 0.55   # порог похожести заголовков (0-1), выше — считаем дублем
  seen_keep: 1500           # сколько последних новостей помним для дедупа

publishing:
  timezone_offset: 3        # Минск, UTC+3
  window_start: 9           # публикуем не раньше
  window_end: 22            # и не позже
  min_gap_minutes: 90       # минимальный интервал между постами
  max_per_day: 6
