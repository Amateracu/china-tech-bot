name: collect

# Сбор новостей и отправка в модерацию. Cron — в UTC (Минск = UTC+3).
on:
  schedule:
    - cron: "10 5,8,11,14,17 * * *"   # 08:10, 11:10, 14:10, 17:10, 20:10 по Минску
  workflow_dispatch:

concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Собрать и отправить на модерацию
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MODERATOR_CHAT_ID: ${{ secrets.MODERATOR_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m bot.collect

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "china-tech-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "нечего коммитить" && exit 0
          git commit -m "state: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
