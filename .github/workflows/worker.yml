name: worker

# Долгая смена вместо коротких запусков по расписанию.
# Один прогон живёт ~5.5 часов, держит связь с Telegram и в конце
# запускает следующий такой же. Расписание оставлено только страховкой
# на случай, если цепочка оборвётся.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: bot-worker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Засечь начало смены
        run: echo "START=$(date +%s)" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Настроить git для сохранения состояния
        run: |
          git config user.name "china-tech-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Смена
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MODERATOR_CHAT_ID: ${{ secrets.MODERATOR_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WORKER_MINUTES: "330"
          COLLECT_HOURS: "8,11,14,17,20"
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m bot.worker

      - name: Передать смену следующему запуску
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN не задан — цепочка оборвётся, запустите worker вручную"
            exit 0
          fi
          # если смена почему-то завершилась мгновенно, не крутим цепочку вхолостую
          ELAPSED=$(( $(date +%s) - START ))
          if [ "$ELAPSED" -lt 300 ]; then
            echo "смена длилась ${ELAPSED}с — жду, чтобы не зациклиться"
            sleep $(( 300 - ELAPSED ))
          fi
          gh workflow run worker.yml --repo "${{ github.repository }}"
          echo "следующая смена запущена"
        continue-on-error: true
