name: moderate

# Обрабатывает нажатия кнопок и публикует одобренное по слотам.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: bot-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # workflow_dispatch привязывает запуск к коммиту на момент нажатия,
      # поэтому подтягиваем актуальное состояние — иначе запуск может затереть
      # очередь, записанную предыдущим прогоном.
      - name: Взять свежее состояние
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Применить решения модератора
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MODERATOR_CHAT_ID: ${{ secrets.MODERATOR_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -m bot.moderate

      - name: Опубликовать следующий пост, если пришёл слот
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m bot.publish

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "china-tech-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet && echo "нечего коммитить" && exit 0
          git commit -m "state: moderate $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 5
          done
          exit 1
